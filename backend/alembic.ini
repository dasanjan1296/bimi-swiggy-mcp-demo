[alembic]
script_location = alembic
# Make the CWD importable so `alembic env.py` can `from app.db import Base`
# when alembic is run as a binary (e.g. inside the production Docker image
# where the CWD isn't automatically on sys.path).
prepend_sys_path = .
sqlalchemy.url = postgresql+asyncpg://bimi:bimi@localhost:5433/bimi

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
