# Bimi WhatsApp POC — Evolution API + Postgres + Redis.
# Self-contained; run with `docker compose --env-file .env up -d`.
# Tear down with `docker compose down -v` (the -v wipes volumes).
#
# Postgres is needed for Evolution's WhatsApp Web session
# persistence — without it you'd re-pair the QR on every restart.
# Redis backs Evolution's internal queue.

services:
  evolution-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: ${EVOLUTION_DB_PASSWORD}
      POSTGRES_DB: evolution
    volumes:
      - evolution-pg:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evolution -d evolution"]
      interval: 5s
      timeout: 3s
      retries: 5

  evolution-redis:
    image: redis:7-alpine
    restart: unless-stopped

  evolution-api:
    # Image is published by the Evolution API team under the `atendai`
    # namespace. Pinned to v2 — `latest` would track the homolog branch
    # which sometimes breaks. Update by bumping this tag.
    image: atendai/evolution-api:v2.1.1
    ports:
      - "8080:8080"
    environment:
      SERVER_URL: ${EVOLUTION_PUBLIC_URL}
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY}

      # ── Database ──
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://evolution:${EVOLUTION_DB_PASSWORD}@evolution-postgres:5432/evolution
      DATABASE_CONNECTION_CLIENT_NAME: evolution
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "true"
      DATABASE_SAVE_MESSAGE_UPDATE: "true"
      DATABASE_SAVE_DATA_CONTACTS: "true"
      DATABASE_SAVE_DATA_CHATS: "true"
      DATABASE_SAVE_DATA_HISTORIC: "true"

      # ── Cache ──
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://evolution-redis:6379/0
      CACHE_REDIS_PREFIX_KEY: evolution

      # ── Webhook ──
      # Global webhook fires for every event from every instance.
      # The POC server filters on event type internally.
      WEBHOOK_GLOBAL_URL: ${POC_WEBHOOK_URL}
      WEBHOOK_GLOBAL_ENABLED: "true"
      WEBHOOK_GLOBAL_WEBHOOK_BY_EVENTS: "false"
      WEBHOOK_EVENTS_MESSAGES_UPSERT: "true"
      WEBHOOK_EVENTS_GROUPS_UPSERT: "true"
      WEBHOOK_EVENTS_CONNECTION_UPDATE: "true"

      # ── QR display ──
      QRCODE_LIMIT: 30  # pairings to attempt before giving up

      # ── Logging ──
      LOG_LEVEL: ERROR
      LOG_COLOR: "true"
    depends_on:
      evolution-postgres:
        condition: service_healthy
      evolution-redis:
        condition: service_started
    restart: unless-stopped
    extra_hosts:
      # Lets Evolution reach the POC server running on your host.
      # Mac/Win Docker Desktop sets this automatically; Linux needs it explicit.
      - "host.docker.internal:host-gateway"

volumes:
  evolution-pg:
